[project]
name = "alphalab-model-runtime"
version = "0.1.0"
description = "Isolated local model runtime boundary for AlphaLab"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "pydantic==2.11.7",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
huggingface = [
  "torch>=2.7,<3",
  "transformers>=4.53,<5",
]
test = [
  "httpx==0.28.1",
  "pytest==8.4.1",
]

[project.scripts]
alphalab-model-runtime = "alphalab_model_runtime.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphalab_model_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
