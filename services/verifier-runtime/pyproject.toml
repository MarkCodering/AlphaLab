[project]
name = "alphalab-verifier-runtime"
version = "0.1.0"
description = "Independent deterministic verification boundary for AlphaLab"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "pydantic==2.11.7",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==8.4.1"]

[project.scripts]
alphalab-verifier-runtime = "alphalab_verifier_runtime.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphalab_verifier_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
