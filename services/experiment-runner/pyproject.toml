[project]
name = "alphalab-experiment-runner"
version = "0.1.0"
description = "Policy-gated built-in experiment runtime for AlphaLab"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "pydantic==2.11.7",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==8.4.1"]

[project.scripts]
alphalab-experiment-runner = "alphalab_experiment_runner.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphalab_experiment_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
